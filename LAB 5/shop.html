<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Bookstore</title>
  <!-- Langkah 8: Google Fonts (Roboto & Merriweather dalam satu tag link) -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shop.css">
</head>
<body>
  <!--
    Error 1 (shop.html, Line 7): Typo rel="stylesheets" changed to rel="stylesheet".
    Error 2 (shop.html, Line 10-12): <style> tag placed inside <body> is invalid HTML; moved rules to shop.css.
    Error 3 (shop.html, Line 18): Inline style syntax "color=#1B4F72;" fixed to "color: #1B4F72;" (and moved to CSS).
    Error 4 (shop.html, Line 20): Table id="product" changed to id="products" to match CSS selector #products.
    Error 5 (shop.css, Line 2): Font name typo 'Robotto' corrected to 'Roboto'.
    Error 6 (shop.css, Line 4): Invalid value "no repeat" corrected to "no-repeat".
    Error 7 (shop.css, Line 5): Property typo "bacground-position" corrected to "background-position".
    Error 8 (shop.css, Line 18): Changed "display: inline;" to "display: block;" so vertical padding works properly on nav links.
    Error 9 (shop.css, Line 23): Invalid selector "li:a:hover" corrected to "li a:hover".
    Error 10 (shop.css, Line 27): Invalid value "border-collapse: collapsed;" corrected to "border-collapse: collapse;".
    Error 11 (shop.css, Line 34): "#products tr:nth-child(2)" changed to "#products tr:nth-child(even)" to style all even rows.
    Error 12 (shop.css, Line 37): Invalid pseudo-class "#products tr:hovered" corrected to "#products tr:hover".
    Error 13 (shop.css, Line 45): Missing semicolon after "background-color: #f1f1f1;" added.
  -->

  <!-- Langkah 5: Header dengan tajuk utama -->
  <header>
    <h1>Campus Bookstore</h1>
  </header>

  <!-- Langkah 5 & 6: Struktur <nav> dengan kelas .active pada pautan Home -->
  <nav>
    <ul>
      <li><a class="active" href="#home">Home</a></li>
      <li><a href="#books">Books</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Langkah 5: Struktur <main> untuk kandungan utama -->
  <main id="home">
    <p>Textbooks, stationery and more for every student.</p>

    <!--Tambah imej di sini-->
    <img src="books.jpg" alt=Books" style="width: 100%; height: 150px; object-fit: cover; margin-bottom: 15px;">

    <table id="products">
      <tr>
        <th>Item</th>
        <th>Category</th>
        <th class="price-col">Price (RM)</th>
      </tr>
      <tr>
        <td>Web Design Basics</td>
        <td>Textbook</td>
        <td class="price-col">45.00</td>
      </tr>
      <tr>
        <td>A4 Notebook</td>
        <td>Stationery</td>
        <td class="price-col">6.50</td>
      </tr>
      <tr>
        <td>USB Drive 32GB</td>
        <td>Gadget</td>
        <td class="price-col">25.00</td>
      </tr>
      <tr>
        <td>Highlighter Set</td>
        <td>Stationery</td>
        <td class="price-col">9.90</td>
      </tr>
    </table>
  </main>

  <!-- Langkah 5 & 9: Struktur <footer> -->
  <footer id="contact">
    &copy; 2026 Campus Bookstore
  </footer>
</body>
</html>
